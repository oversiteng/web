info:
  name: Resolve Bank Account
  type: http
  seq: 7
http:
  method: POST
  url: '{{baseUrl}}/banks/resolve'
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "bankCode": "058",
        "accountNumber": "0123456789"
      }
  auth: inherit
  settings:
    encodeUrl: true
    timeout: 0
    followRedirects: true
    maxRedirects: 5
