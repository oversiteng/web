info:
  name: Get Task Chat Messages
  type: http
  seq: 2
http:
  method: GET
  url: '{{baseUrl}}/chat/{{taskId}}/messages'
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit
  settings:
    encodeUrl: true
    timeout: 0
    followRedirects: true
    maxRedirects: 5
