info:
  name: 7. Set Task Quote
  type: http
  seq: 7
http:
  method: PATCH
  url: '{{baseUrl}}/admin/tasks/{{taskId}}/quote'
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{adminToken}}
  body:
    type: json
    data: |-
      {
        "priceNgn": 45000,
        "agentTargetHours": 4,
        "pricingBreakdown": {
          "baseFee": 25000,
          "logistics": 15000,
          "statutoryDocumentation": 5000
        },
        "adminNotes": "Official quote prepared by Central Operations Desk."
      }
  auth: inherit
  settings:
    encodeUrl: true
    timeout: 0
    followRedirects: true
    maxRedirects: 5
