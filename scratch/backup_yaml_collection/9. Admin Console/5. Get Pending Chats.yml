info:
  name: 5. Get Pending Chats
  type: http
  seq: 5
http:
  method: GET
  url: '{{baseUrl}}/admin/chats/pending?limit=20&page=1'
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit
  settings:
    encodeUrl: true
    timeout: 0
    followRedirects: true
    maxRedirects: 5
