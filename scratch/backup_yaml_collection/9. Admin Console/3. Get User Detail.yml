http:
  method: GET
  url: '{{baseUrl}}/admin/users/{{targetUserId}}'
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit
  settings:
    encodeUrl: true
    timeout: 0
    followRedirects: true
    maxRedirects: 5
