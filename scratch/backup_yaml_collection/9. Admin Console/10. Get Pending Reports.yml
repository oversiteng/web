info:
  name: 10. Get Pending Reports
  type: http
  seq: 10
http:
  method: GET
  url: '{{baseUrl}}/admin/reports/pending'
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit
  settings:
    encodeUrl: true
    timeout: 0
    followRedirects: true
    maxRedirects: 5
