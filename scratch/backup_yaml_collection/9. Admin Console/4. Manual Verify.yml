info:
  name: 4. Manual Verify
  type: http
  seq: 4
http:
  method: POST
  url: '{{baseUrl}}/admin/users/{{targetUserId}}/verify'
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit
  settings:
    encodeUrl: true
    timeout: 0
    followRedirects: true
    maxRedirects: 5
  body:
    type: none
