info:
  name: 8. Submit Background Consent
  type: http
  seq: 8
http:
  method: POST
  url: '{{baseUrl}}/kyc/consent'
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "consentBackgroundCheck": true,
        "consentTermsAndConditions": true,
        "signatureFullName": "Emeka Chukwu"
      }
  auth: inherit
  settings:
    encodeUrl: true
    timeout: 0
    followRedirects: true
    maxRedirects: 5
