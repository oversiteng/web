info:
  name: Update Password
  type: http
  seq: 7
http:
  method: PUT
  url: '{{baseUrl}}/users/me/password'
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "currentPassword": "securepassword123",
        "newPassword": "newsecurepassword456"
      }
  auth: inherit
  settings:
    encodeUrl: true
    timeout: 0
    followRedirects: true
    maxRedirects: 5
