info:
  name: 3. Verify NIN (KYC)
  type: http
  seq: 3
http:
  method: POST
  url: '{{baseUrl}}/kyc/verify/nin'
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "ninNumber": "12345678901"
      }
  auth: inherit
  settings:
    encodeUrl: true
    timeout: 0
    followRedirects: true
    maxRedirects: 5
