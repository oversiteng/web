info:
  name: Accept Quote
  type: http
  seq: 4
http:
  method: POST
  url: '{{baseUrl}}/tasks/{{taskId}}/quote/accept'
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit
  settings:
    encodeUrl: true
    timeout: 0
    followRedirects: true
    maxRedirects: 5
  body:
    type: none
