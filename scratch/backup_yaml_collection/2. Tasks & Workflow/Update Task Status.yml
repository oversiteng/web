info:
  name: Update Task Status
  type: http
  seq: 7
http:
  method: PATCH
  url: '{{baseUrl}}/tasks/{{taskId}}/status'
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "status": "AGENT_EN_ROUTE"
      }
  auth: inherit
  settings:
    encodeUrl: true
    timeout: 0
    followRedirects: true
    maxRedirects: 5
