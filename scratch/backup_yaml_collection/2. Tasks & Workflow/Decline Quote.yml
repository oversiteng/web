info:
  name: Decline Quote
  type: http
  seq: 6
http:
  method: POST
  url: '{{baseUrl}}/tasks/{{taskId}}/quote/decline'
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "reason": "Price exceeds budget"
      }
  auth: inherit
  settings:
    encodeUrl: true
    timeout: 0
    followRedirects: true
    maxRedirects: 5
