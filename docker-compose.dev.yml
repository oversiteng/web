name: oversite-dev

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: oversite_dev_web
    ports:
      - "3001:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true # Ensures Next.js picks up file events in Docker
      - DATABASE_URL=postgres://oversite_user:oversite_password@postgres:5432/oversitedb_dev
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    develop:
      watch:
        # Syncs code changes instantly without rebuilding the image
        - action: sync
          path: .
          target: /app # <-- Ensure this matches the WORKDIR in your Dockerfile!
          ignore:
            - node_modules/
            - .next/
            - .git/
        # Only rebuild if package dependencies change
        - action: rebuild
          path: package.json
        # Restart the container if env changes
        - action: restart
          path: .env.local

  postgres:
    image: postgres:16-alpine
    container_name: oversite_dev_postgres
    environment:
      POSTGRES_USER: oversite_user
      POSTGRES_PASSWORD: oversite_password
      POSTGRES_DB: oversitedb_dev
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U oversite_user -d oversitedb_dev" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: oversite_dev_redis
    volumes:
      - dev_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  payment:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: oversite_dev_payment
    ports:
      - "4001:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
    restart: always

volumes:
  dev_postgres_data:
  dev_redis_data:
