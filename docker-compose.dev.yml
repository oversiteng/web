name: oversite-dev
services:
  web:
    container_name: oversite_dev_web
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://postgres:abraham2003.com@postgres:5432/oversitedb_dev
      - REDIS_URL=redis://redis:6379
    restart: always

  postgres:
    container_name: oversite_dev_postgres
    environment:
      POSTGRES_DB: oversitedb_dev
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    container_name: oversite_dev_redis
    volumes:
      - dev_redis_data:/data
    restart: always

  payment:
    container_name: oversite_dev_payment
    ports:
      - "4001:4000"
    environment:
      - NODE_ENV=development
    restart: always

volumes:
  dev_postgres_data:
  dev_redis_data:
