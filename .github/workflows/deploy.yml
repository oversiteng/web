name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Env File
        run: |
          echo "${{ secrets.PRODUCTION_ENV_FILE }}" > .env.local

      - name: Copy project files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/oversite-prod"
          # Exclude heavy folders that shouldn't be copied
          rm: true 
          strip_components: 0

      - name: SSH into VPS and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/ubuntu/oversite-prod
            
            # Start/Restart the containers in detached mode
            if command -v docker-compose >/dev/null 2>&1; then
              sudo docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            else
              sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            fi
