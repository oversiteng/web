name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - staging
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Environment
        id: env
        run: |
          BRANCH="${GITHUB_REF##*/}"
          if [ "$BRANCH" = "main" ]; then
            echo "env_name=prod" >> $GITHUB_OUTPUT
            echo "deploy_dir=/home/ubuntu/oversite-prod" >> $GITHUB_OUTPUT
            echo "compose_override=docker-compose.prod.yml" >> $GITHUB_OUTPUT
            echo "env_secret=PRODUCTION_ENV_FILE" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "staging" ]; then
            echo "env_name=staging" >> $GITHUB_OUTPUT
            echo "deploy_dir=/home/ubuntu/oversite-staging" >> $GITHUB_OUTPUT
            echo "compose_override=docker-compose.staging.yml" >> $GITHUB_OUTPUT
            echo "env_secret=STAGING_ENV_FILE" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "dev" ]; then
            echo "env_name=dev" >> $GITHUB_OUTPUT
            echo "deploy_dir=/home/ubuntu/oversite-dev" >> $GITHUB_OUTPUT
            echo "compose_override=docker-compose.dev.yml" >> $GITHUB_OUTPUT
            echo "env_secret=DEV_ENV_FILE" >> $GITHUB_OUTPUT
          fi

      - name: Create Env File
        env:
          DEV_ENV: ${{ secrets.DEV_ENV_FILE }}
          STAGING_ENV: ${{ secrets.STAGING_ENV_FILE }}
          PROD_ENV: ${{ secrets.PRODUCTION_ENV_FILE }}
          ENV_SECRET: ${{ steps.env.outputs.env_secret }}
        run: |
          if [ "$ENV_SECRET" = "DEV_ENV_FILE" ] && [ -n "$DEV_ENV" ]; then
            printf "%s\n" "$DEV_ENV" > .env.local
          elif [ "$ENV_SECRET" = "STAGING_ENV_FILE" ] && [ -n "$STAGING_ENV" ]; then
            printf "%s\n" "$STAGING_ENV" > .env.local
          elif [ "$ENV_SECRET" = "PRODUCTION_ENV_FILE" ] && [ -n "$PROD_ENV" ]; then
            printf "%s\n" "$PROD_ENV" > .env.local
          else
            echo "No secret provided for $ENV_SECRET, creating fallback .env.local"
            touch .env.local
          fi

      - name: Copy project files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: ${{ steps.env.outputs.deploy_dir }}
          # Exclude heavy folders that shouldn't be copied
          rm: true
          strip_components: 0

      - name: SSH into VPS and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd ${{ steps.env.outputs.deploy_dir }}

            # Start/Restart the containers in detached mode
            COMPOSE_FILE="${{ steps.env.outputs.compose_override }}"
            if command -v docker-compose >/dev/null 2>&1; then
              sudo docker-compose -f $COMPOSE_FILE up -d --build
            else
              sudo docker compose -f $COMPOSE_FILE up -d --build
            fi

            # Automatically verify container health and initialize database
            ENV_NAME="${{ steps.env.outputs.env_name }}"
            CONTAINER_NAME="oversite_${ENV_NAME}_web"
            echo "⏳ Verifying ${CONTAINER_NAME} health and applying schema updates..."

            # Ping the healthcheck endpoint to trigger database initialization & safety patches
            for i in {1..20}; do
              if sudo docker ps --filter "name=${CONTAINER_NAME}" --filter "status=running" -q | grep -q .; then
                echo "Container is running, pinging healthcheck endpoint to initialize database..."
                if sudo docker exec -i "${CONTAINER_NAME}" node -e "fetch('http://127.0.0.1:3000/api/health').then(r => r.json()).then(d => { console.log('Healthcheck status:', JSON.stringify(d)); process.exit(0); }).catch(e => { console.error('Waiting for app...', e.message); process.exit(1); })"; then
                  echo "✅ Database initialized and app is healthy!"
                  break
                fi
              fi
              echo "Waiting for container and DB to be ready (attempt $i/20)..."
              sleep 3
            done

            echo "✅ Deployed and verified ${{ steps.env.outputs.env_name }} environment successfully"
