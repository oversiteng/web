name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - staging
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Environment
        id: env
        run: |
          BRANCH="${GITHUB_REF##*/}"
          if [ "$BRANCH" = "main" ]; then
            echo "env_name=prod" >> $GITHUB_OUTPUT
            echo "deploy_dir=/home/ubuntu/oversite-prod" >> $GITHUB_OUTPUT
            echo "compose_override=docker-compose.prod.yml" >> $GITHUB_OUTPUT
            echo "env_secret=PRODUCTION_ENV_FILE" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "staging" ]; then
            echo "env_name=staging" >> $GITHUB_OUTPUT
            echo "deploy_dir=/home/ubuntu/oversite-staging" >> $GITHUB_OUTPUT
            echo "compose_override=docker-compose.staging.yml" >> $GITHUB_OUTPUT
            echo "env_secret=STAGING_ENV_FILE" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "dev" ]; then
            echo "env_name=dev" >> $GITHUB_OUTPUT
            echo "deploy_dir=/home/ubuntu/oversite-dev" >> $GITHUB_OUTPUT
            echo "compose_override=docker-compose.dev.yml" >> $GITHUB_OUTPUT
            echo "env_secret=DEV_ENV_FILE" >> $GITHUB_OUTPUT
          fi

      - name: Create Env File
        run: |
          ENV_SECRET="${{ steps.env.outputs.env_secret }}"
          CONTENT=""
          if [ "$ENV_SECRET" = "DEV_ENV_FILE" ] && [ -n "${{ secrets.DEV_ENV_FILE }}" ]; then
            CONTENT="${{ secrets.DEV_ENV_FILE }}"
          elif [ "$ENV_SECRET" = "STAGING_ENV_FILE" ] && [ -n "${{ secrets.STAGING_ENV_FILE }}" ]; then
            CONTENT="${{ secrets.STAGING_ENV_FILE }}"
          else
            CONTENT="${{ secrets.PRODUCTION_ENV_FILE }}"
          fi

          if [ -n "$CONTENT" ]; then
            echo "$CONTENT" > .env.local
          else
            touch .env.local
          fi

      - name: Copy project files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: ${{ steps.env.outputs.deploy_dir }}
          # Exclude heavy folders that shouldn't be copied
          rm: true
          strip_components: 0

      - name: SSH into VPS and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ steps.env.outputs.deploy_dir }}

            # Start/Restart the containers in detached mode
            COMPOSE_FILE="${{ steps.env.outputs.compose_override }}"
            if command -v docker-compose >/dev/null 2>&1; then
              sudo docker-compose -f $COMPOSE_FILE up -d --build
            else
              sudo docker compose -f $COMPOSE_FILE up -d --build
            fi

            echo "✅ Deployed ${{ steps.env.outputs.env_name }} environment successfully"
