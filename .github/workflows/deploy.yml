name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - staging
      - dev

# Ensures only one deployment runs on the VPS at a time, cancelling older queued runs
concurrency:
  group: vps-deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Single Unified Dev Environment
        id: env
        run: |
          echo "env_name=dev" >> $GITHUB_OUTPUT
          echo "deploy_dir=/home/ubuntu/oversite-dev" >> $GITHUB_OUTPUT
          echo "compose_override=docker-compose.dev.yml" >> $GITHUB_OUTPUT
          echo "env_secret=DEV_ENV_FILE" >> $GITHUB_OUTPUT

      - name: Create Env File
        env:
          DEV_ENV: ${{ secrets.DEV_ENV_FILE }}
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_BUCKET: ${{ secrets.AWS_S3_MEDIA_BUCKET }}
          AWS_REG: ${{ secrets.AWS_REGION }}
        run: |
          if [ -n "$DEV_ENV" ]; then
            printf "%s\n" "$DEV_ENV" > .env.local
          else
            touch .env.local
          fi

          if [ -n "$AWS_KEY" ]; then
            echo "AWS_ACCESS_KEY_ID=$AWS_KEY" >> .env.local
          fi
          if [ -n "$AWS_SECRET" ]; then
            echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET" >> .env.local
          fi
          if [ -n "$AWS_BUCKET" ]; then
            echo "AWS_S3_MEDIA_BUCKET=$AWS_BUCKET" >> .env.local
          fi
          if [ -n "$AWS_REG" ]; then
            echo "AWS_REGION=$AWS_REG" >> .env.local
          fi

      - name: Copy env file to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: ".env.local"
          target: /home/ubuntu/oversite-dev

      - name: SSH into VPS and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 45m
          script: |
            set -e
            cd /home/ubuntu/oversite-dev

            # Authenticate git with ephemeral Actions token to fetch private repo
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            sudo docker compose -f docker-compose.dev.yml up -d --build web

            CONTAINER_NAME="oversite_dev_web"
            echo "⏳ Verifying ${CONTAINER_NAME} health and applying schema updates..."

            HEALTH_OK=false
            for i in {1..20}; do
              if sudo docker ps --filter "name=${CONTAINER_NAME}" --filter "status=running" -q | grep -q .; then
                echo "Container is running, pinging healthcheck endpoint to initialize database..."
                if timeout 30s sudo docker exec -i "${CONTAINER_NAME}" node -e "fetch('http://127.0.0.1:3000/api/health', { signal: AbortSignal.timeout(15000) }).then(r => r.json()).then(d => { console.log('Healthcheck status:', JSON.stringify(d)); process.exit(0); }).catch(e => { console.error('Waiting for app...', e.message); process.exit(1); })"; then
                  echo "✅ Database initialized and app is healthy!"
                  HEALTH_OK=true
                  break
                fi
              fi
              echo "Retrying health check in 3 seconds (attempt $i/20)..."
              sleep 3
            done

            if [ "$HEALTH_OK" != "true" ]; then
              echo "❌ Healthcheck failed after retries for ${CONTAINER_NAME}"
              sudo docker logs --tail 200 "${CONTAINER_NAME}" || true
              exit 1
            fi

            echo "✅ Single unified dev environment deployed successfully!"
